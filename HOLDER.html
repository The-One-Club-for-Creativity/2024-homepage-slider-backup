<style>
  /* General Styling */
  .sliderContainer {
    margin: 0 auto;
    text-align: center;
    width: 100%;
    max-width: 1351.69px;
  }

  .paneContainer {
    position: relative;

    /* Gap between slides */
    padding: 0 5px 0 5px;
  }

  .paneContainerLink {
    cursor: pointer;
    display: block;
  }

  /* Explicit box + compositing layer — Safari needs this inside Slick's transformed track */
  .paneMedia {
    display: block;
    width: 1350px;
    max-width: 100%;
    aspect-ratio: 1350 / 540;
    max-height: 540px;
    position: relative;
    overflow: hidden;
  }

  .paneMedia video,
  .paneMedia img {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 1;
    transition: none;
  }

  .slick-slide .paneMedia img {
    transition: opacity 0.5s;
    opacity: 75%;
  }

  .slick-center .paneMedia img {
    opacity: 100%;
  }

  /* --------- BOTTOM LINK ---------  */

  .videoLinkContainer {
    position: absolute;
    bottom: 20px;
    text-align: left;
    z-index: 2;
    pointer-events: none;

    /* Main positioning of link button */
    /* left: 20%; */

    /* To hide the buttons until they aren't centered */
    visibility: hidden;
    opacity: 1;
    transition: visibility 0.5s;
  }

  .videoLinkContainer .videoLink {
    pointer-events: auto;
  }

  /* Show links when on center slide */
  .slick-center .videoLinkContainer {
    visibility: visible;
    opacity: 1;
  }

  .videoLink {
    text-decoration: none;
    text-transform: uppercase;
    font-weight: bold;
    font-size: 14pt;
    letter-spacing: 0px;
    color: black;
    background-color: white;
    border: 1px solid black;
    padding: 7.5px 15px 6.5px;

    transition: 0.5s;
  }

  .videoLink:hover {
    background-color: black;
    color: white;
    border: 1px solid white;
  }

  .videoLinkText {
    color: white;
    text-shadow: 2px 2px 4px black;
    font-weight: bold;
    font-size: 20pt;
  }

  /* ------- ARROW BUTTONS -------- */
  .slick-prev {
    left: 15px;
    margin-left: 5px;
  }
  .slick-next {
    right: 15px;
    margin-right: 5px;
  }

  .slick-prev,
  .slick-next {
    z-index: 1;
    width: 35px;
    height: 35px;
    border-radius: 100%;
  }

  .slick-prev:before,
  .slick-next:before {
    font-size: 40px;
    color: rgb(255, 255, 255);
    opacity: 75%;
    text-shadow: 2px 2px 4px rgb(0, 0, 0);
    transition: 0.5s;
  }

  .slick-next:focus,
  .slick-prev:focus {
    opacity: 75%;
    transition: 0.5s;
  }

  .slick-prev:hover,
  .slick-next:hover {
    opacity: 1;
    transition: 0.5s;
  }

  /* Hide prev/next until slick-theme’s icon font is ready (avoids empty/wrong arrows) */
  .sliderContainer:not(.slick-fonts-ready) .slick-arrow {
    opacity: 0;
    pointer-events: none;
  }

  .sliderContainer .slick-arrow {
    transition: opacity 0.2s ease;
  }

  /* ----- MEDIA QUERIES ----- */

  /* After left menu disappears */
  @media screen and (max-width: 991px) {
    .paneMedia {
      width: 95vw;
    }
    .videoLinkText {
      font-size: 16pt;
    }
    .slider {
      margin-bottom: 20px;
    }
  }

  /* Phones and tiny browsers */
  @media screen and (max-width: 600px) {
    .videoLinkText {
      font-size: 12pt;
    }
    .videoLink {
      font-size: 10pt;
    }
    .slick-prev:before,
    .slick-next:before {
      opacity: 0;
    }
  }
</style>

<script type="text/javascript">
  $(document).ready(function () {
    function playVideo(video) {
      video.muted = true;
      if (video.readyState === 0) {
        video.load();
      }
      var playAttempt = video.play();
      if (playAttempt && playAttempt.catch) {
        playAttempt.catch(function () {});
      }
    }

    function manageSliderVideos() {
      $(".slider .slick-slide video").each(function () {
        var video = this;
        var isCenter = $(video)
          .closest(".slick-slide")
          .hasClass("slick-center");

        if (isCenter) {
          playVideo(video);
        } else {
          video.pause();
        }
      });
    }

    $(".slider").on("init afterChange", manageSliderVideos);
    $(".slider").on("loadedmetadata", "video", function () {
      if ($(this).closest(".slick-slide").hasClass("slick-center")) {
        playVideo(this);
      }
    });
    $(window).on("pageshow", manageSliderVideos);

    $(".slider").slick({
      centerMode: true,
      centerPadding: "80px",
      autoplay: true,
      autoplaySpeed: 5000,
      speed: 500,
      arrows: true,
      infinite: true,
      slidesToShow: 1,
      slidesToScroll: 1,
      mobileFirst: true,
      adaptiveHeight: false,
      variableWidth: true,
      lazyLoad: "progressive",
      useTransform: false,
    });

    var $sliderRoot = $(".sliderContainer");
    function showSlickArrowsAfterSlickFont() {
      $sliderRoot.addClass("slick-fonts-ready");
    }
    if (document.fonts && document.fonts.load) {
      var slickFontFallbackTimer = setTimeout(
        showSlickArrowsAfterSlickFont,
        3000,
      );
      document.fonts.load('40px "slick"').then(
        function () {
          clearTimeout(slickFontFallbackTimer);
          showSlickArrowsAfterSlickFont();
        },
        function () {
          clearTimeout(slickFontFallbackTimer);
          showSlickArrowsAfterSlickFont();
        },
      );
    } else {
      showSlickArrowsAfterSlickFont();
    }

    // Go to the next slide after 0.5 seconds
    setTimeout(function () {
      $(".slider").slick("slickNext");
    }, 1);

    // Dynamically control the left position of the Link Container so it's always in the bottom left corner
    function updateLinkContainerPosition() {
      var paneContainerHalfWidth = $(".paneContainer").first().outerWidth() / 2;
      var slickListHalfWidth = $(".slick-list").outerWidth() / 2;
      var leftValue = paneContainerHalfWidth - slickListHalfWidth + 20;
      $(".videoLinkContainer").css("left", leftValue + "px");
    }

    updateLinkContainerPosition();
    $(window).resize(updateLinkContainerPosition);
    $(".slider").on("setPosition", updateLinkContainerPosition);
    $(".slider").on("afterChange", function () {
      $(".slider").slick("setPosition");
    });
    $(".slider").slick("setPosition");
  });
</script>
